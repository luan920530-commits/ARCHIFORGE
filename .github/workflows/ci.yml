name: Python validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run static and regression tests
        run: python -m unittest discover -s tests -v

  extension-package:
    # Builds and validates the Blender 4.2+ extension package with Blender's
    # own `blender_ext.py` CLI (pure Python 3.11+, no Blender binary needed).
    runs-on: ubuntu-latest
    env:
      BLENDER_TAG: v5.2.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch Blender's extension CLI and official tag list
        # Kept outside the checkout so they never end up inside the package.
        run: |
          mkdir -p "$RUNNER_TEMP/blext"
          curl -fsSL -o "$RUNNER_TEMP/blext/blender_ext.py" "https://raw.githubusercontent.com/blender/blender/${BLENDER_TAG}/scripts/addons_core/bl_pkg/cli/blender_ext.py"
          curl -fsSL -o "$RUNNER_TEMP/blext/tags.py" "https://raw.githubusercontent.com/blender/blender/${BLENDER_TAG}/scripts/modules/_bpy_internal/extensions/tags.py"
      - name: Build extension package
        run: |
          mkdir -p dist
          python "$RUNNER_TEMP/blext/blender_ext.py" build --source-dir . --output-dir dist --valid-tags "$RUNNER_TEMP/blext/tags.py" --verbose
      - name: Validate extension package
        run: |
          python "$RUNNER_TEMP/blext/blender_ext.py" validate --valid-tags "$RUNNER_TEMP/blext/tags.py" dist/archiforge-*.zip
          if unzip -l dist/archiforge-*.zip | grep -E " (tests/|patch_|icons/generate_icons.py|\.github/)"; then
            echo "development files leaked into the package"; exit 1
          fi
          unzip -l dist/archiforge-*.zip | grep -q " blender_manifest.toml$"
      - uses: actions/upload-artifact@v4
        with:
          name: archiforge-extension
          path: dist/archiforge-*.zip
          if-no-files-found: error
