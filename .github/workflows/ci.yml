name: Python validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run static and regression tests
        run: python -m unittest discover -s tests -v

  extension-package:
    # Builds and validates the Blender 4.2+ extension package with Blender's
    # own `blender_ext.py` CLI (pure Python 3.11+, no Blender binary needed).
    runs-on: ubuntu-latest
    env:
      BLENDER_TAG: v5.2.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch Blender's extension CLI and official tag list
        # Kept outside the checkout so they never end up inside the package.
        run: |
          mkdir -p "$RUNNER_TEMP/blext"
          curl -fsSL -o "$RUNNER_TEMP/blext/blender_ext.py" "https://raw.githubusercontent.com/blender/blender/${BLENDER_TAG}/scripts/addons_core/bl_pkg/cli/blender_ext.py"
          curl -fsSL -o "$RUNNER_TEMP/blext/tags.py" "https://raw.githubusercontent.com/blender/blender/${BLENDER_TAG}/scripts/modules/_bpy_internal/extensions/tags.py"
      - name: Build extension package
        run: |
          mkdir -p dist
          python "$RUNNER_TEMP/blext/blender_ext.py" build --source-dir . --output-dir dist --valid-tags "$RUNNER_TEMP/blext/tags.py" --verbose
      - name: Validate extension package
        run: |
          python "$RUNNER_TEMP/blext/blender_ext.py" validate --valid-tags "$RUNNER_TEMP/blext/tags.py" dist/archiforge-*.zip
          if unzip -l dist/archiforge-*.zip | grep -E " (tests/|patch_|icons/generate_icons.py|\.github/)"; then
            echo "development files leaked into the package"; exit 1
          fi
          unzip -l dist/archiforge-*.zip | grep -q " blender_manifest.toml$"
      - uses: actions/upload-artifact@v4
        with:
          name: archiforge-extension
          path: dist/archiforge-*.zip
          if-no-files-found: error

  blender-smoke:
    # Installs the package built above inside a REAL Blender 4.2 LTS (headless)
    # with the same operator as "Install from Disk", then runs every operator.
    # This is the check users without a 4.2-capable machine rely on.
    name: Blender 4.2 LTS smoke test (real Blender, extension install)
    runs-on: ubuntu-latest
    needs: extension-package
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archiforge-extension
          path: dist
      - name: Resolve the latest Blender 4.2.x LTS Linux build
        id: blender
        run: |
          FILE=$(curl -fsSL https://download.blender.org/release/Blender4.2/ \
            | grep -oE 'blender-4\.2\.[0-9]+-linux-x64\.tar\.xz' | sort -uV | tail -1)
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using $FILE"
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: ~/blender
          key: ${{ runner.os }}-${{ steps.blender.outputs.file }}
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender4.2/${{ steps.blender.outputs.file }}" \
            | tar -xJ -C ~/blender --strip-components=1
      - name: System libraries required by the headless binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 > /dev/null
      - name: Blender version
        run: ~/blender/blender --version
      - name: Validate the package with Blender's own command
        run: ~/blender/blender --command extension validate dist/archiforge-*.zip
      - name: Install as extension and exercise every operator
        run: |
          ~/blender/blender -b --python-exit-code 1 --python tests/blender_smoke_42.py -- \
            --zip dist/archiforge-*.zip --report smoke_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-42-smoke-report
          path: smoke_report.json
          if-no-files-found: warn
